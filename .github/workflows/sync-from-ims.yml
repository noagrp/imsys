name: One-time sync from ims

on:
  push:
    paths:
      - '.github/workflows/sync-from-ims.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout imsys
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone source IMS
        run: git clone --depth 1 https://github.com/noagrp/ims.git /tmp/ims-source

      - name: Replace repository contents
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          rsync -a --exclude='.git' /tmp/ims-source/ ./
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Clone current IMS into imsys'
          git push origin main
